name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10 # ローカルの pnpm 10.30.2 に合わせる

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall で prisma generate が走るため、この時点で Prisma Client が生成される
      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: npx tsc --noEmit

      - name: リント
        run: pnpm lint

      - name: ユニットテスト
        run: pnpm test run
