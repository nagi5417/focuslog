name: Deploy

on:
  push:
    branches: [main]

# OIDC トークンの発行に必要
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: focuslog

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 長期キーではなく OIDC で一時的な認証情報を得る
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/focuslog-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # arm64 のイメージを x86 のランナーで作るため QEMU を使う
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: イメージのビルドとプッシュ
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
            DEPLOYMENT_ID=${{ github.sha }}
          # 既定だと provenance/attestation 付きの OCI イメージインデックスになり、
          # Lambda が "image manifest ... is not supported" で拒否する(Phase 6で踏んだ失敗と同じ)。
          # Lambda が要求する単一マニフェスト形式にするため両方 false にする。
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CDK のデプロイ
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy --all --require-approval never \
            -c domainName=${{ vars.APP_DOMAIN }} \
            -c imageTag=${{ github.sha }}
